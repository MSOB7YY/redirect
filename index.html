<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Namida</title>
    <style>
      :root {
        --bg: #faf8f6;
        --card: #ffffff;
        --border: #e7e2dc;
        --text: #1d1d1d;
        --text-dim: #6e6e6e;
        --accent: #6f4e37;
        --accent-hover: #573c2a;
        --on-accent: #ffffff;
        --secondary: #f3efea;
        --secondary-hover: #e7e2dc;
        --error: #a8443a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131110;
          --card: #1d1b17;
          --border: #2e2a23;
          --text: #f5f0e6;
          --text-dim: #8a8473;
          --accent: #d1a077;
          --accent-hover: #dcb08c;
          --on-accent: #1a0d06;
          --secondary: #2e2a23;
          --secondary-hover: #3d382e;
          --error: #e08a7d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }

      #card {
        background-color: var(--card);
        border-radius: 22px;
        padding: 32px 28px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        border: 1px solid var(--border);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }

      #status {
        color: var(--text-dim);
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
      }

      #status.error {
        color: var(--error);
      }

      #actions {
        display: none;
        flex-direction: column;
        gap: 10px;
        margin-top: 24px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s;
      }

      #returnButton {
        background-color: var(--accent);
        color: var(--on-accent);
      }

      #returnButton:hover {
        background-color: var(--accent-hover);
      }

      #copyButton {
        background-color: var(--secondary);
        color: var(--text);
      }

      #copyButton:hover {
        background-color: var(--secondary-hover);
      }

      #hint {
        display: none;
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.5;
        margin: 16px 0 0;
      }
    </style>
    <script>
      const ALLOWED_DEEP_LINK = "app://patreonauth.msob7y.namida";
      const LOOPBACK_STATE_REGEX = /^lp\.(\d{4,5})\.[A-Za-z0-9_-]+$/;

      function buildQuery(params) {
        const parts = [];
        params.forEach((value, key) => {
          parts.push(encodeURIComponent(key) + "=" + encodeURIComponent(value));
        });
        return parts.join("&");
      }

      function resolveLoopbackPort(state) {
        const match = LOOPBACK_STATE_REGEX.exec(state || "");
        if (!match) return null;
        const port = parseInt(match[1], 10);
        return port >= 1024 && port <= 65535 ? port : null;
      }

      function showError(message) {
        document.getElementById("title").textContent = "Sign in failed";
        const status = document.getElementById("status");
        status.textContent = message;
        status.classList.add("error");
      }

      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const url = params.get("url");
        params.delete("url");

        if (url !== ALLOWED_DEEP_LINK) {
          showError("This redirect is not allowed.");
          return;
        }

        const error = params.get("error");
        if (error) {
          showError(params.get("error_description") || error);
          return;
        }

        if (!params.get("code")) {
          showError("No sign in code was provided. Please try signing in again from Namida.");
          return;
        }

        const query = buildQuery(params);
        const deepLink = ALLOWED_DEEP_LINK + "?" + query;
        const loopbackPort = resolveLoopbackPort(params.get("state"));
        const targetUrl = loopbackPort === null ? deepLink : "http://127.0.0.1:" + loopbackPort + "/patreonauth?" + query;

        const goToTarget = function () {
          window.location.href = targetUrl;
        };

        document.getElementById("returnButton").onclick = goToTarget;

        const copyButton = document.getElementById("copyButton");
        copyButton.onclick = async function () {
          try {
            await navigator.clipboard.writeText(deepLink);
            copyButton.textContent = "Copied";
          } catch (_) {
            window.prompt("Copy this link", deepLink);
          }
          setTimeout(() => (copyButton.textContent = "Copy link"), 2000);
        };

        document.getElementById("actions").style.display = "flex";
        document.getElementById("hint").style.display = "block";

        goToTarget();
      };
    </script>
  </head>

  <body>
    <div id="card">
      <h1 id="title">Returning to Namida…</h1>
      <p id="status">You should be taken back automatically.</p>
      <div id="actions">
        <button id="returnButton">Return to Namida</button>
        <button id="copyButton">Copy link</button>
      </div>
      <p id="hint">
        If nothing happens, copy the link and paste it in Namida.<br />
        Don't share this link with anyone.
      </p>
    </div>
  </body>
</html>
